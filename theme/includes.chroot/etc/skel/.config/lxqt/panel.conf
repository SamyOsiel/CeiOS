[General]
__userfile__=true

[panels]
panels\1\size=1

[panel1]
alignment=1
iconSize=24
lineCount=1
panelSize=46
plugins=mainmenu,taskbar,tray,clock
position=Bottom
reserveSpace=true

[plugins]
mainmenu\icon=/usr/share/ceios/assets/ceios-icon.svg
mainmenu\showFilter=true
taskbar\grouping=true
clock\showSeconds=false

; Apariencia tipo Windows 11: barra centrada abajo, botón de inicio con el logo
; de CeiOS, tareas agrupadas y bandeja a la derecha. Ajusta con «Configurar panel».
