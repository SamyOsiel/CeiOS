# CeiOS — picom en modo ligero (X11)
backend = "xrender";
vsync = true;

shadow = true;
shadow-radius = 10;
shadow-opacity = 0.45;
shadow-offset-x = -8;
shadow-offset-y = -8;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Sin sombra en panel ni menús (rendimiento en 2 GB de RAM)
shadow-exclude = [
  "class_g = 'lxqt-panel'",
  "window_type = 'dock'",
  "window_type = 'menu'"
];
